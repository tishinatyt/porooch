name: Collect events for moderation
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Collect source pages or backfill missing coordinates only
        type: choice
        options: [collect, backfill]
        default: collect
        required: true
permissions:
  contents: read
concurrency:
  group: poruch-event-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check required secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo '::error::Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in GitHub repository Actions secrets.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore venue geocode fallback cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/venue-geocodes.json
          key: ${{ runner.os }}-poruch-geocodes-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-poruch-geocodes-v1-
      - name: Collect or backfill (publication follows source settings)
        run: node scripts/ingest/run.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'collect' }}
          NOMINATIM_URL: ${{ vars.NOMINATIM_URL }}
          GEOCODE_MAX_REQUESTS: ${{ vars.GEOCODE_MAX_REQUESTS }}
      - name: Save venue fallback cache even on partial failure
        if: ${{ always() && hashFiles('.cache/venue-geocodes.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/venue-geocodes.json
          key: ${{ runner.os }}-poruch-geocodes-v1-${{ github.run_id }}-${{ github.run_attempt }}
