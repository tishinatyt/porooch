name: One-shot audit autofix

on:
  push:
    branches: [audit/full-project-logic]
    paths: [.github/workflows/audit-autofix.yml]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[audit-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-project-logic
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply audited source fixes
        run: node scripts/apply-audit-fixes.mjs
      - name: Remove one-shot tooling
        run: rm -f scripts/apply-audit-fixes.mjs .github/workflows/audit-autofix.yml
      - name: Validate build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Validate diff
        run: git diff --check
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix audit logic and state bugs [audit-fix]"
          git push origin audit/full-project-logic
