name: One-shot dependency audit fix

on:
  push:
    branches: [audit/full-project-logic]
    paths: [.github/workflows/audit-deps-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-project-logic
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply safe lockfile audit fix
        run: |
          npm audit fix --package-lock-only
          if ! git diff --quiet -- package.json; then
            echo "package.json changed unexpectedly"
            git diff -- package.json
            exit 1
          fi
      - name: Verify no high or critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Validate build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      - name: Validate diff
        run: git diff --check
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/audit-deps-fix.yml
      - name: Commit verified dependency fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/audit-deps-fix.yml
          git commit -m "Fix audited transitive dependency [audit-deps]"
          git push origin audit/full-project-logic
