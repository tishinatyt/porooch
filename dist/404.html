<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>porooch</title>
    <script>
      // SPA redirect for GitHub Pages
      // Saves the full path+query+hash to sessionStorage, then redirects to app root.
      // BrowserRouter uses the /porooch project base, so no prefix stripping is needed.
      var l = window.location;
      sessionStorage.redirect = l.pathname + l.search + l.hash;
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/porooch/');
    </script>
  </head>
  <body></body>
</html>
