<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Poruch</title>
    <script>
      // SPA redirect for GitHub Pages. Preserve OAuth query/hash too.
      var l = window.location;
      try {
        sessionStorage.setItem('porooch:redirect', l.pathname + l.search + l.hash);
      } catch (_) {
        // Continue to the app root when storage is unavailable.
      }
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/');
    </script>
  </head>
  <body></body>
</html>
